logging:  
  level: DEBUG
db_config:
  database_url: ""  # Set via DATABASE_URL in .env file
  pool_pre_ping: True
  autocommit: False
  autoflush: False
  tablename: "deploymentSpecInstance"
ado_config:
  AZURE_DEVOPS_PAT : ""  # Your Azure DevOps Personal Access Token (set via .env file)
  ORGANIZATION : ""  # Your Azure DevOps organization name
  PROJECT : ""  # Your Azure DevOps project name
  PIPELINE_NAME : ""  # Your Azure DevOps pipeline name
  BRANCH_NAME : ""  # Your Azure DevOps branch name
service_principle_cred:
  TENANT_ID : ""  # Set via TENANT_ID in .env file
  CLIENT_ID : ""  # Set via CLIENT_ID in .env file
  CLIENT_SECRET : ""  # Set via CLIENT_SECRET in .env file
aks_config:
  AKS_API_SERVER : ""  # Your AKS cluster API server URL
  NAMESPACE : ""  # Your Kubernetes namespace