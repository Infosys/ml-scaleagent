version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: # Provide Postgres user
      POSTGRES_PASSWORD: # Provide Postgres password
      POSTGRES_DB: # Provide Postgres database name
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: # Provide Postgres connection URL (e.g., postgresql+psycopg2://user:password@db:5432/dbname)
    depends_on:
      - db
    ports:
      - '8000:8000'
volumes:
  db_data:
