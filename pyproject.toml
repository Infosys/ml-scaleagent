[project]
name = "mlscaler"
version = "0.1.0"
description = "ML deployment management system for Kubernetes-based machine learning model scaling and orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Infosys Limited", email = "opensource@infosys.com"}
]
keywords = ["mlops", "kubernetes", "machine-learning", "deployment", "scaling", "azure", "databricks", "model-serving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.24",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.32.5",
    "kubernetes==35.0.0",
    "prettytable==3.17.0",
]


# This creates a command `mlscaler` on install
[project.scripts]
mlscaler = "app.cli.app:app" 

[tool.setuptools]  
packages = ["app"]  